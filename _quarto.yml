project:
  type: book
  output-dir: docs
  resources:
    - data/
    - audit-tools/

book:
  title: "AI考古学通论"
  subtitle: "数据、案例与实践 | Data, Cases & Exercises"
  repo-url: https://github.com/AI-Archaeology/AI-Archaeology-Textbook
  repo-actions: [edit, issue]
  # Quarto Book derives its navigation from chapters; keep all pages in the book.
  # A6 archival entries are visually suppressed by styles.css but remain rendered/linkable.
  sidebar:
    collapse-level: 1
    search: true
  chapters:
    - index.qmd
    - part: "第一编 认识AI考古学"
      chapters:
        - chapters/chapter-01.qmd
        - chapters/chapter-02.qmd
        - chapters/chapter-03.qmd
        - chapters/chapter-04.qmd
    - part: "第二编 方法基础：从统计到机器学习"
      chapters:
        - chapters/chapter-05.qmd
        - chapters/chapter-06.qmd
        - chapters/chapter-07.qmd
        - chapters/chapter-08.qmd
    - part: "第三编 解决考古问题"
      chapters:
        - chapters/chapter-09.qmd
        - chapters/chapter-10.qmd
        - chapters/chapter-11.qmd
        - chapters/chapter-12.qmd
        - chapters/chapter-13.qmd
        - chapters/chapter-14.qmd
        - chapters/chapter-15.qmd
        - chapters/chapter-16.qmd
        - chapters/chapter-17.qmd
        - chapters/chapter-18.qmd
        - chapters/chapter-19.qmd
        - chapters/chapter-20.qmd
    - part: "第四编 生成式AI与考古知识生产"
