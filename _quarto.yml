format:
  html:
    theme: cosmo
    grid:
      sidebar-width: 320px
      body-width: 900px
      margin-width: 230px
      gutter-width: 1.5rem
    css: styles.css
    toc: true
    number-sections: true
    code-copy: true
    link-external-newwindow: true

lang: zh
execute:
  freeze: auto
